<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<html>

<head>
  <title>MITforRD RTS Service</title>
  <meta name="GENERATOR" content="Quanta Plus">
</head>
<body>
<h3>Actions</h3>

<A href="/?suspend" name="Suspend">Suspend</A>

<h3>MITforRD RTS service status</h3>

<table width="600" frame="above">
  <thead bgcolor="lightGray">
    <tr align="center">
      <th width="50%">Part</th>
      <th>Status</th>
    </tr>
  </thead>
  <tbody align="center">
    <tr>
      <td>Configured</td>
      <td>&nbsp;<strong><#init></strong>&nbsp;</td>
    </tr>
    <tr>
      <td>Connected to CCOM</td>
      <td>&nbsp;<strong><#ccom></strong>&nbsp;</td>
    </tr>
    <tr>
      <td>Running</td>
      <td>&nbsp;<strong><#run></strong>&nbsp;</td>
    </tr>
    <tr>
      <td>Times evaluated</td>
      <td>&nbsp;<strong><#times></strong>&nbsp;</td>
    </tr>
    <tr>
      <td>Last evaluated</td>
      <td>&nbsp;<strong><#last_eval></strong>&nbsp;</td>
    </tr>
  </tbody>
</table>

<h3>Signals</h3>

<table width="600" frame="above">
  <thead bgcolor="lightGray">
    <tr align="center">
      <th width="50%">Name</th>
      <th>Value</th>
    </tr>
  </thead>
  <tbody align="center">
  <#sig_list>
  </tbody>
</table>

<h3>Models</h3>

<table width="600" frame="above">
  <thead bgcolor="lightGray">
    <tr align="center">
      <th width="50%">Name</th>
      <th>Last calculated</th>
    </tr>
  </thead>
  <tbody align="center">
  <#mod_list>
  </tbody>
</table>


</body>
</html>
